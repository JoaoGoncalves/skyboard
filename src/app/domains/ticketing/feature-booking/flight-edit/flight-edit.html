<h1>Flight Edit #{{ id() }}</h1>

<form [formRoot]="flightForm">
  <fieldset>
    <div class="form-group">
      <label for="from">From</label>
      <input id="from" class="form-control" [formField]="flightForm.from" />
     <app-validation-pane [errors]="flightForm.from().errors()" />
    </div>

    <div class="form-group">
      <label for="to">To</label>
      <input id="to" class="form-control" [formField]="flightForm.to" />
       <app-validation-pane [errors]="flightForm.to().errors()" />
    </div>

    <div class="form-group">
      <label for="date">Date</label>
      <input id="date" type="datetime-local" class="form-control" [formField]="flightForm.date" />
      <app-validation-pane [errors]="flightForm.date().errors()" />
    </div>

    <div class="form-group">
      <label>
        <input type="checkbox" [formField]="flightForm.delayed" />
        Delayed
      </label>
    </div>

   @if (!flightForm.delay().hidden()) {
  <div class="form-group">
    <label for="delay">Delay (min)</label>
    <input id="delay" type="number" class="form-control" [formField]="flightForm.delay" />
    <app-validation-pane [errors]="flightForm.delay().errors()" />
  </div>
}
  </fieldset>
 <app-validation-pane [errors]="flightForm().errors()" />
  <button>Save</button>
  <h4>{{message()}}</h4>
</form>

<a routerLink="../../flight-search">Back to search</a>

<!-- debug: retirar no fim -->
<hr />
<small>
  dirty: {{ flightForm().dirty() }} · touched: {{ flightForm().touched() }} · invalid: {{ flightForm().invalid() }}
</small>
<pre>{{ flight() | json }}</pre>
<pre>{{flightForm().errorSummary() | json}}</pre>
